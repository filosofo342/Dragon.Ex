<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <meta name="description"
        content="Dragon.Ex: organização de estudos, roteiros, questões e acompanhamento escolar.">
  <title>Dragon.Ex — Central de estudos</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #101426;
      --panel: #1b223b;
      --input: #12192d;
      --text: #f5f7ff;
      --muted: #bcc6df;
      --primary: #8a71ff;
      --primary-dark: #6546e7;
      --border: #35405e;
      --success: #82e5b1;
      --error: #ffacac;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button, input, select, textarea, a {
      -webkit-tap-highlight-color: transparent;
    }

    button, select, input, textarea {
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px;
      background: var(--input);
      color: var(--text);
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    button {
      padding: 10px 15px;
      background: var(--primary);
      color: white;
      cursor: pointer;
      font-weight: 650;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button.secondary {
      background: var(--input);
    }

    button.danger {
      background: #703443;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    :focus-visible {
      outline: 3px solid #d1c5ff;
      outline-offset: 3px;
    }

    a {
      color: #d1c5ff;
    }

    header, main, footer {
      max-width: 1120px;
      margin: auto;
      padding: 22px;
    }

    header {
      padding-top: 34px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.3rem);
    }

    h2, h3 {
      line-height: 1.3;
    }

    h2 {
      margin-top: 0;
    }

    .brand {
      color: #baa8ff;
    }

    .muted, small {
      color: var(--muted);
    }

    .panel, .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .panel {
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
      gap: 16px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr 2fr;
      gap: 14px;
    }

    .row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .between {
      justify-content: space-between;
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    nav button {
      white-space: nowrap;
      background: var(--panel);
    }

    nav button[aria-pressed="true"] {
      background: var(--primary-dark);
    }

    label {
      display: block;
    }

    label > span {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .topic {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 12px 0;
    }

    .topic input {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      margin-top: 5px;
    }

    .topic span {
      margin: 0;
      font-weight: normal;
    }

    progress {
      width: 100%;
      height: 16px;
      accent-color: var(--primary);
    }

    .badge {
      display: inline-block;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 10px;
      color: var(--muted);
      font-size: .85rem;
    }

    .timer {
      font-size: clamp(3rem, 12vw, 5rem);
      font-variant-numeric: tabular-nums;
      margin: 12px 0;
    }

    .answer {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      background: var(--input);
    }

    .feedback {
      padding: 12px;
      border-radius: 10px;
      background: var(--input);
      margin-top: 12px;
    }

    .success {
      color: var(--success);
    }

    .error {
      color: var(--error);
    }

    .task {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }

    .task label {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-wrap: anywhere;
    }

    .task input {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .completed {
      text-decoration: line-through;
      color: var(--muted);
    }

    .notice {
      border-left: 4px solid var(--primary);
      padding: 12px 16px;
      background: var(--input);
      border-radius: 8px;
    }

    #status {
      min-height: 26px;
      color: var(--success);
    }

    [hidden] {
      display: none !important;
    }

    footer {
      color: var(--muted);
      font-size: .9rem;
      padding-bottom: 40px;
    }

    @media (max-width: 700px) {
      .filters {
        grid-template-columns: 1fr;
      }

      header, main, footer {
        padding: 16px;
      }

      .panel, .card {
        padding: 16px;
      }
    }
  </style>
</head>

  <header
